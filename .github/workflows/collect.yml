name: OpenPulse Daily Intelligence Collection

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openpulse-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run OpenPulse pipeline
        run: |
          python -m openpulse.main

      - name: Summarize run and alert on issues
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("reports/latest.json")
          summary = {}
          if summary_path.exists():
              try:
                  summary = json.loads(summary_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  summary = {}

          failed = int(summary.get("failed_collectors", 0) or 0)
          new_total = int(summary.get("new_total", 0) or 0)
          updated_total = int(summary.get("updated_total", 0) or 0)
          failed_names = summary.get("failed_collector_names", []) or []

          if failed > 0:
              print(f"::warning::{failed} collector(s) failed: {', '.join(failed_names) if failed_names else 'unknown'}")
          else:
              print("::notice::All collectors completed successfully.")

          if new_total or updated_total:
              print(f"Detected {new_total} new and {updated_total} updated records.")
          else:
              print("::notice::No meaningful data changes were detected in this run.")

          summary_lines = [
              "## OpenPulse run summary",
              "",
              f"- Trigger event: {os.environ.get('GITHUB_EVENT_NAME', 'unknown')}",
              f"- Run number: {os.environ.get('GITHUB_RUN_NUMBER', 'unknown')}",
              f"- New records: {new_total}",
              f"- Updated records: {updated_total}",
              f"- Failed collectors: {failed}",
          ]
          if failed_names:
              summary_lines.append(f"- Failed collector names: {', '.join(failed_names)}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(summary_lines) + "\n")
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          OPENPULSE_SHOULD_COMMIT=$(python - <<'PY'
          import json
          from pathlib import Path

          from openpulse.automation import should_commit

          summary_path = Path("reports/latest.json")
          summary = {}
          if summary_path.exists():
            try:
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
            except json.JSONDecodeError:
              summary = {}

          print("true" if should_commit(summary) else "false")
          PY
          )

          OPENPULSE_COMMIT_MESSAGE=$(python - <<'PY'
          import json
          from pathlib import Path

          from openpulse.automation import build_commit_message

          summary_path = Path("reports/latest.json")
          summary = {}
          if summary_path.exists():
            try:
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
            except json.JSONDecodeError:
              summary = {}

          print(build_commit_message(summary))
          PY
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${OPENPULSE_SHOULD_COMMIT}" != "true" ]; then
            echo "No meaningful changes to commit."
            {
              echo ""
              echo "## Commit decision"
              echo "- Decision: skipped"
              echo "- Reason: commit policy returned false (no meaningful changes)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add data/ reports/

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            {
              echo ""
              echo "## Commit decision"
              echo "- Decision: skipped"
              echo "- Reason: no staged file changes after data/report update"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "${OPENPULSE_COMMIT_MESSAGE}"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
          {
            echo ""
            echo "## Commit decision"
            echo "- Decision: pushed"
            echo "- Message: ${OPENPULSE_COMMIT_MESSAGE}"
          } >> "$GITHUB_STEP_SUMMARY"
