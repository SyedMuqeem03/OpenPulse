name: OpenPulse Daily Intelligence Collection

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openpulse-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run OpenPulse pipeline
        run: |
          python -m openpulse.main

      - name: Commit and push changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from openpulse.automation import build_commit_message, should_commit

          summary_path = Path("reports/latest.json")
          summary = {}
          if summary_path.exists():
              try:
                  summary = json.loads(summary_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  summary = {}

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"OPENPULSE_SHOULD_COMMIT={str(should_commit(summary)).lower()}\n")
              fh.write(f"OPENPULSE_COMMIT_MESSAGE={build_commit_message(summary)}\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${OPENPULSE_SHOULD_COMMIT}" != "true" ]; then
            echo "No meaningful changes to commit."
            exit 0
          fi

          git add data/ reports/

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "${OPENPULSE_COMMIT_MESSAGE}"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
